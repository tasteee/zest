<z-row gap="4" aligns-y="center">
  <z-number-input is-borderless is-inline min="20" max="300" value="120" aria-label="Tempo in BPM">
    <span slot="suffix">BPM</span>
  </z-number-input>
  <z-number-input min="0" step="0.5" value="12.5" aria-label="Price in dollars" has-stepper-buttons>
    <span slot="prefix">$</span>
  </z-number-input>
</z-row>
