<z-card gap="5" style="width: min(24rem, 100%); padding: 1.75rem">
  <z-column gap="1">
    <z-heading size="xs" tag="h2">Sign in with a link</z-heading>
    <z-text size="sm" color="muted">No password. We’ll email you a one-time link.</z-text>
  </z-column>
  <z-column gap="4">
    <z-input label="Email" type="email" placeholder="you@example.com" autocomplete="email"></z-input>
    <z-button tone="primary" is-full-width>Email me a link</z-button>
  </z-column>
  <z-separator label="or"></z-separator>
  <z-button kind="outline" is-full-width>Use a password instead</z-button>
</z-card>
