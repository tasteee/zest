<z-card gap="0" style="width: min(34rem, 100%); padding: 0">
  <z-row aligns-x="between" aligns-y="center" gap="3" style="padding: 1.25rem; border-bottom: 1px solid var(--border-default)">
    <z-heading size="xs" tag="h2">Payment methods</z-heading>
    <z-button kind="outline" size="sm">Add card</z-button>
  </z-row>
  <z-list is-plain aria-label="Payment methods">
    <z-list-row>
      <div style="flex: 1; min-width: 0">
        <z-row gap="2" aligns-y="center"><z-text weight="600">Visa ending 4242</z-text><z-badge tone="secondary">Default</z-badge></z-row>
        <z-text size="sm" color="muted" style="display: block">Expires 08 / 28</z-text>
      </div>
      <z-row gap="2" aligns-x="end"><z-button kind="ghost" size="sm">Remove</z-button></z-row>
    </z-list-row>
    <z-list-row>
      <div style="flex: 1; min-width: 0">
        <z-text weight="600">Mastercard ending 1881</z-text>
        <z-text size="sm" color="muted" style="display: block">Expires 02 / 27</z-text>
      </div>
      <z-row gap="2" aligns-x="end">
        <z-button kind="outline" size="sm">Make default</z-button>
        <z-button kind="ghost" size="sm">Remove</z-button>
      </z-row>
    </z-list-row>
  </z-list>
</z-card>
