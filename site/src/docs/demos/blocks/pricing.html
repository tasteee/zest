<z-grid min-column-width="14rem" gap="3" style="width: min(52rem, 100%)">
  <z-card gap="4" style="padding: 1.5rem">
    <z-column gap="1">
      <z-text weight="600">Hobby</z-text>
      <z-row gap="1" aligns-y="end"><z-stat value="$0" size="lg"></z-stat><z-text size="sm" color="muted">/ month</z-text></z-row>
    </z-column>
    <z-column gap="2">
      <z-text size="sm">1 project</z-text>
      <z-text size="sm">Community support</z-text>
    </z-column>
    <z-button kind="outline" is-full-width>Get started</z-button>
  </z-card>
  <z-card gap="4" style="padding: 1.5rem; border-color: var(--purple)">
    <z-column gap="1">
      <z-row gap="2" aligns-y="center"><z-text weight="600">Pro</z-text><z-badge tone="secondary">Popular</z-badge></z-row>
      <z-row gap="1" aligns-y="end"><z-stat value="$12" size="lg"></z-stat><z-text size="sm" color="muted">/ month</z-text></z-row>
    </z-column>
    <z-column gap="2">
      <z-text size="sm">Unlimited projects</z-text>
      <z-text size="sm">Priority support</z-text>
      <z-text size="sm">Custom domains</z-text>
    </z-column>
    <z-button tone="secondary" is-full-width>Start free trial</z-button>
  </z-card>
  <z-card gap="4" style="padding: 1.5rem">
    <z-column gap="1">
      <z-text weight="600">Team</z-text>
      <z-row gap="1" aligns-y="end"><z-stat value="$29" size="lg"></z-stat><z-text size="sm" color="muted">/ seat</z-text></z-row>
    </z-column>
    <z-column gap="2">
      <z-text size="sm">Everything in Pro</z-text>
      <z-text size="sm">SSO and audit log</z-text>
    </z-column>
    <z-button kind="outline" is-full-width>Contact sales</z-button>
  </z-card>
</z-grid>
