<z-card gap="3" style="width: min(34rem, 100%); padding: 1.25rem">
  <z-column gap="1">
    <z-heading size="xs" tag="h2">Invite teammates</z-heading>
    <z-text size="sm" color="muted">They’ll get an email with a link to join.</z-text>
  </z-column>
  <z-row gap="2" does-wrap>
    <z-input type="email" placeholder="name@example.com" aria-label="Email" style="flex: 1; min-width: 12rem"></z-input>
    <z-select id="role" aria-label="Role" value="editor" style="width: 8rem"></z-select>
    <z-button tone="primary">Send invite</z-button>
  </z-row>
  <z-text size="xs" color="muted">Viewers can read. Editors can change. Admins can invite.</z-text>
</z-card>
