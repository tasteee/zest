<z-card gap="4" style="width: min(30rem, 100%); padding: 1.5rem">
  <z-heading size="xs" tag="h2">Your cart</z-heading>
  <z-column gap="4">
    <z-row gap="3" aligns-y="center">
      <z-avatar name="Canvas tote" size="md" is-square></z-avatar>
      <z-column gap="0" style="flex: 1; min-width: 0"><z-text weight="600">Canvas tote</z-text><z-text size="sm" color="muted">Natural · One size</z-text></z-column>
      <z-text weight="600" style="font-family: var(--font-mono)">$32.00</z-text>
    </z-row>
    <z-row gap="3" aligns-y="center">
      <z-avatar name="Ceramic mug" size="md" is-square></z-avatar>
      <z-column gap="0" style="flex: 1; min-width: 0"><z-text weight="600">Ceramic mug</z-text><z-text size="sm" color="muted">Slate · 350 ml</z-text></z-column>
      <z-text weight="600" style="font-family: var(--font-mono)">$18.00</z-text>
    </z-row>
  </z-column>
  <z-line></z-line>
  <z-column gap="2">
    <z-row aligns-x="between"><z-text size="sm" color="muted">Subtotal</z-text><z-text size="sm">$50.00</z-text></z-row>
    <z-row aligns-x="between"><z-text size="sm" color="muted">Shipping</z-text><z-text size="sm">$5.00</z-text></z-row>
    <z-row aligns-x="between"><z-text weight="600">Total</z-text><z-text weight="600">$55.00</z-text></z-row>
  </z-column>
  <z-button tone="secondary" is-full-width>Checkout</z-button>
</z-card>
