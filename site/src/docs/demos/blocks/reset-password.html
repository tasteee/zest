<z-card gap="5" style="width: min(24rem, 100%); padding: 1.75rem">
  <z-column gap="1">
    <z-heading size="xs" tag="h2">Choose a new password</z-heading>
    <z-text size="sm" color="muted">Use at least 8 characters.</z-text>
  </z-column>
  <form id="reset">
    <z-column gap="4">
      <z-input id="password" label="New password" type="password" name="password" autocomplete="new-password"></z-input>
      <z-input id="confirm" label="Confirm password" type="password" name="confirm" autocomplete="new-password"></z-input>
      <z-button type="submit" tone="primary" is-full-width>Update password</z-button>
    </z-column>
  </form>
</z-card>
