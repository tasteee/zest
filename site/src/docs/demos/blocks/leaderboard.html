<z-card gap="0" style="width: min(30rem, 100%); padding: 0">
  <z-heading size="xs" tag="h2" style="padding: 1rem 1.25rem; border-bottom: 1px solid var(--border)">Top contributors</z-heading>
  <z-list is-plain aria-label="Top contributors">
    <z-list-row>
      <z-text weight="600" style="width: 1.5rem; font-family: var(--font-mono)">1</z-text>
      <z-row gap="3" aligns-y="center">
        <z-avatar name="Ada Lovelace" size="sm"></z-avatar>
        <z-text>Ada Lovelace</z-text>
      </z-row>
      <z-text size="sm" color="muted" style="font-family: var(--font-mono)">2,481</z-text>
    </z-list-row>
    <z-list-row>
      <z-text weight="600" style="width: 1.5rem; font-family: var(--font-mono)">2</z-text>
      <z-row gap="3" aligns-y="center">
        <z-avatar name="Grace Hopper" size="sm" tone="tertiary"></z-avatar>
        <z-text>Grace Hopper</z-text>
      </z-row>
      <z-text size="sm" color="muted" style="font-family: var(--font-mono)">1,902</z-text>
    </z-list-row>
    <z-list-row>
      <z-text weight="600" style="width: 1.5rem; font-family: var(--font-mono)">3</z-text>
      <z-row gap="3" aligns-y="center">
        <z-avatar name="Alan Turing" size="sm"></z-avatar>
        <z-text>Alan Turing</z-text>
      </z-row>
      <z-text size="sm" color="muted" style="font-family: var(--font-mono)">1,640</z-text>
    </z-list-row>
  </z-list>
</z-card>
