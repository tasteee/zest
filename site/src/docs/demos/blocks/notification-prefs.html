<z-card gap="0" style="width: min(34rem, 100%); padding: 0">
  <z-column gap="1" style="padding: 1.25rem; border-bottom: 1px solid var(--border)">
    <z-heading size="xs" tag="h2">Notifications</z-heading>
    <z-text size="sm" color="muted">Choose what reaches your inbox.</z-text>
  </z-column>
  <z-column gap="4" style="padding: 1.25rem">
    <z-switch is-checked label="Mentions" description="When someone @mentions you."></z-switch>
    <z-switch is-checked label="Comments" description="Replies to your threads."></z-switch>
    <z-switch label="Weekly digest" description="A Monday summary of what you missed."></z-switch>
  </z-column>
</z-card>
