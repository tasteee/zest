<z-surface level="1" is-bordered radius="lg" style="width: min(34rem, 100%); padding: 1.5rem">
  <z-column gap="4">
    <z-column gap="1">
      <z-heading size="xs" tag="h2">Stay in the loop</z-heading>
      <z-text size="sm" color="muted">One email a month. Unsubscribe any time.</z-text>
    </z-column>
    <z-row gap="2" does-wrap>
      <z-input type="email" placeholder="you@example.com" aria-label="Email" style="flex: 1; min-width: 12rem"></z-input>
      <z-button tone="primary">Subscribe</z-button>
    </z-row>
  </z-column>
</z-surface>
