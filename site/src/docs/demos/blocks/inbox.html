<z-row gap="0" style="width: min(48rem, 100%); height: 20rem; border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden">
  <z-list id="messages" label="Messages" style="width: 16rem; flex: none; border-right: 1px solid var(--border); overflow: auto"></z-list>
  <z-column gap="3" padding="5" style="flex: 1; min-width: 0">
    <z-heading id="subject" size="xs" tag="h2"></z-heading>
    <z-text id="from" size="sm" color="muted"></z-text>
    <z-text id="body" size="sm"></z-text>
  </z-column>
</z-row>
