<z-field label="Toppings" description="Choose up to three." style="max-width: 20rem">
  <z-checkbox-group name="toppings" has-select-all max="3" tone="secondary">
    <z-checkbox value="basil" is-checked>Basil</z-checkbox>
    <z-checkbox value="mushroom">Mushroom</z-checkbox>
    <z-checkbox value="olive">Olive</z-checkbox>
    <z-checkbox value="pepper" is-disabled>Pepper (sold out)</z-checkbox>
  </z-checkbox-group>
</z-field>
