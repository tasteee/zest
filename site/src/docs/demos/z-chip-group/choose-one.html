<z-column gap="5">
  <z-field label="Size">
    <z-chip-group name="size" kind="soft">
      <z-chip value="s">Small</z-chip>
      <z-chip value="m" is-selected>Medium</z-chip>
      <z-chip value="l">Large</z-chip>
    </z-chip-group>
  </z-field>
  <z-chip-group label="Density" size="sm" tone="secondary">
    <z-chip value="compact">Compact</z-chip>
    <z-chip value="cozy" is-selected>Cozy</z-chip>
    <z-chip value="roomy">Roomy</z-chip>
  </z-chip-group>
</z-column>
