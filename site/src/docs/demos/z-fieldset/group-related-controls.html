<z-fieldset legend="Shipping address" description="Where should we send your order?" kind="outline" style="max-width: 28rem">
  <z-field label="Street"><z-input autocomplete="street-address"></z-input></z-field>
  <z-row gap="3">
    <z-field label="City"><z-input autocomplete="address-level2"></z-input></z-field>
    <z-field label="Postcode"><z-input autocomplete="postal-code"></z-input></z-field>
  </z-row>
  <z-switch label="Use as billing address" is-checked></z-switch>
</z-fieldset>
