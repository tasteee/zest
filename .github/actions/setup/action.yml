name: Setup
description: pnpm, Node, dependencies, and (optionally) a cached Playwright Chromium.

inputs:
  playwright:
    description: Install Chromium for Playwright.
    default: 'false'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash

    # The browser download is the slow part. Key it on the lockfile, which
    # pins the Playwright version.
    - id: playwright-cache
      if: inputs.playwright == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

    - if: inputs.playwright == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
      run: pnpm exec playwright install --with-deps chromium
      shell: bash

    # On a cache hit the browser is already on disk; only the system
    # libraries (which are not cached) are missing.
    - if: inputs.playwright == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
      run: pnpm exec playwright install-deps chromium
      shell: bash
